name: Browser Tests

# Run on every push, pull request, or manual trigger.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      HEADLESS: "true"
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check credentials are configured
        shell: bash
        run: |
          if [[ -z "$TEST_USER_EMAIL" || -z "$TEST_USER_PASSWORD" ]]; then
            echo "::error::Add TEST_USER_EMAIL and TEST_USER_PASSWORD as repository secrets."
            exit 1
          fi

      # Chrome is installed on the GitHub-hosted Ubuntu runner.
      - name: Check Chrome
        run: google-chrome --version

      - name: Run tests
        run: python -m pytest tests/ -v --junitxml=reports/results.xml

      # Save the report even when a test fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
          if-no-files-found: warn
          retention-days: 7