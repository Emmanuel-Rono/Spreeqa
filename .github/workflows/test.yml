name: Browser Tests

# Run on every push, pull request, or manual trigger.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: Storefront URL including /us/en, reachable by the runner
        required: false
        type: string
      run_payments:
        description: Also place a Stripe test-mode order
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  framework-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check framework helpers
        run: python -m pytest tests/unit -v --junitxml=reports/framework.xml
      - name: Check browser test discovery
        run: python -m pytest --collect-only -q -m ui
      - name: Upload framework report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-report
          path: reports/
      - name: Explain browser coverage
        env:
          STOREFRONT_URL: ${{ inputs.base_url || vars.STOREFRONT_URL }}
        run: |
          if [[ -z "$STOREFRONT_URL" ]]; then
            echo '::notice::Browser tests are NOT RUN. Set repository variable STOREFRONT_URL to a running test store reachable by this runner.'
          fi

  tests:
    needs: framework-checks
    # Do not confuse passing helper checks with a passing browser suite.
    # Untrusted fork PRs do not run against the configured mutable test store.
    if: >-
      (inputs.base_url != '' || vars.STOREFRONT_URL != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      HEADLESS: "true"
      BASE_URL: ${{ inputs.base_url || vars.STOREFRONT_URL }}
      TEST_PRODUCT_SLUG: ${{ vars.TEST_PRODUCT_SLUG }}
      TEST_PRODUCT_OPTIONS: ${{ vars.TEST_PRODUCT_OPTIONS || '[]' }}
      STRIPE_PAYMENT_METHOD: ${{ vars.STRIPE_PAYMENT_METHOD || 'Credit Card' }}

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check product fixture is configured
        shell: bash
        run: |
          if [[ -z "$TEST_PRODUCT_SLUG" ]]; then
            echo "::error::Set repository variable TEST_PRODUCT_SLUG to a stocked test product."
            exit 1
          fi

      # Chrome is installed on the GitHub-hosted Ubuntu runner.
      - name: Check Chrome
        run: google-chrome --version

      - name: Run tests
        run: python -m pytest -m "ui and not payment" -v --junitxml=reports/results.xml

      - name: Run optional Stripe purchase
        if: ${{ inputs.run_payments }}
        run: python -m pytest -m payment --run-payments -v --junitxml=reports/payment.xml

      # Save the report even when a test fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
          if-no-files-found: warn
          retention-days: 7
